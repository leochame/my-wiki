<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Post-Norm 与 Pre-Norm Transformer 对比</title>
  <desc id="desc">左侧 Post-Norm 在残差相加后执行 LayerNorm；右侧 Pre-Norm 在注意力或前馈子层前执行 LayerNorm。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <style>
      .title { font: 700 30px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .subtitle { font: 600 21px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
      .label { font: 600 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .note { font: 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .formula { font: italic 17px Georgia, serif; fill: #334155; }
      .box { stroke-width: 2; rx: 12; }
      .flow { stroke: #475569; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .skip { stroke: #94a3b8; stroke-width: 2.5; fill: none; stroke-dasharray: 7 6; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1200" height="700" fill="#f8fafc"/>
  <text x="600" y="50" text-anchor="middle" class="title">Transformer Block：Post-Norm 与 Pre-Norm</text>

  <rect x="45" y="82" width="530" height="565" rx="22" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="310" y="122" text-anchor="middle" class="subtitle">Post-Norm（原始 Transformer）</text>
  <text x="310" y="150" text-anchor="middle" class="formula">x(l+1) = LN(x(l) + F(x(l)))</text>

  <text x="310" y="613" text-anchor="middle" class="label">输入 x(l)</text>
  <path d="M310 587 L310 555" class="flow"/>
  <rect x="195" y="495" width="230" height="60" class="box" fill="#dbeafe" stroke="#60a5fa"/>
  <text x="310" y="532" text-anchor="middle" class="label">Attention / FFN</text>
  <path d="M310 495 L310 455" class="flow"/>
  <circle cx="310" cy="432" r="22" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="310" y="439" text-anchor="middle" class="label">＋</text>
  <path d="M310 410 L310 370" class="flow"/>
  <rect x="195" y="310" width="230" height="60" class="box" fill="#ede9fe" stroke="#8b5cf6"/>
  <text x="310" y="347" text-anchor="middle" class="label">LayerNorm</text>
  <path d="M310 310 L310 270" class="flow"/>
  <text x="310" y="250" text-anchor="middle" class="label">输出 x(l+1)</text>
  <path d="M285 585 C105 585, 105 432, 285 432" class="skip"/>
  <text x="112" y="505" class="note">残差支路</text>
  <text x="310" y="205" text-anchor="middle" class="note">先执行子层，再残差相加，最后归一化</text>

  <rect x="625" y="82" width="530" height="565" rx="22" fill="#ffffff" stroke="#86efac" stroke-width="3"/>
  <text x="890" y="122" text-anchor="middle" class="subtitle">Pre-Norm（现代 GPT / LLM 常用）</text>
  <text x="890" y="150" text-anchor="middle" class="formula">x(l+1) = x(l) + F(LN(x(l)))</text>

  <text x="890" y="613" text-anchor="middle" class="label">输入 x(l)</text>
  <path d="M890 587 L890 555" class="flow"/>
  <rect x="775" y="495" width="230" height="60" class="box" fill="#ede9fe" stroke="#8b5cf6"/>
  <text x="890" y="532" text-anchor="middle" class="label">LayerNorm</text>
  <path d="M890 495 L890 455" class="flow"/>
  <rect x="775" y="395" width="230" height="60" class="box" fill="#dcfce7" stroke="#22c55e"/>
  <text x="890" y="432" text-anchor="middle" class="label">Attention / FFN</text>
  <path d="M890 395 L890 350" class="flow"/>
  <circle cx="890" cy="327" r="22" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="890" y="334" text-anchor="middle" class="label">＋</text>
  <path d="M890 305 L890 270" class="flow"/>
  <text x="890" y="250" text-anchor="middle" class="label">输出 x(l+1)</text>
  <path d="M865 585 C685 585, 685 327, 865 327" class="skip"/>
  <text x="692" y="470" class="note">干净的残差通路</text>
  <text x="890" y="205" text-anchor="middle" class="note">先归一化，再执行子层，最后残差相加</text>

  <text x="600" y="680" text-anchor="middle" class="note">LN = LayerNorm；F = Attention 或 FFN 子层</text>
</svg>
