[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-infra-lab"
version = "0.1.0"
description = "GPU kernel and LLM infrastructure experiments"
requires-python = ">=3.10"
dependencies = ["torch"]

[tool.setuptools.packages.find]
include = ["kernels*"]
