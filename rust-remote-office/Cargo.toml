[package]
name = "rust-remote-office"
version = "1.0.0"
edition = "2024"
rust-version = "1.95"
description = "Rust Remote Office V1 for macOS and Windows"
license = "MIT"

[features]
default = ["desktop"]
desktop = ["dep:eframe", "dep:arboard", "dep:enigo", "dep:xcap", "dep:screencapturekit"]

[dependencies]
anyhow = "1"
base64 = "0.22"
iroh = "=1.4.1"
postcard = { version = "1.1", features = ["use-std"] }
rand = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subtle = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "fs", "signal"] }
tokio-util = { version = "0.7", features = ["rt"] }
zstd = "0.14"
eframe = { version = "=0.37.0", default-features = false, features = ["default_fonts", "wgpu", "x11", "wayland"], optional = true }
arboard = { version = "3.7", optional = true }
blake3 = "1"
tempfile = "3"

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
enigo = { version = "=0.6.1", optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
xcap = { version = "=0.9.10", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
screencapturekit = { version = "=11.1.2", features = ["macos_14_0"], optional = true }

[profile.release]
lto = "thin"
strip = true
