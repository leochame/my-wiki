[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "schwab-longbridge-trading-platform"
version = "0.1.0"
description = "Trading platform MVP with Longbridge market data and Schwab execution"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic-settings>=2.6,<3",
  "uvicorn[standard]>=0.32,<1",
  "longbridge>=0.4",
]

[tool.setuptools.packages.find]
include = ["app*"]
