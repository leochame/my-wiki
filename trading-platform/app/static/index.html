<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>交易平台 MVP</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <main class="shell">
      <header>
        <div>
          <p class="eyebrow">MARKET TERMINAL</p>
          <h1>行情与交易</h1>
          <p class="muted">长桥提供行情，嘉信负责执行。当前默认纸上交易。</p>
        </div>
        <span id="mode" class="status">连接中</span>
      </header>

      <section class="toolbar">
        <label>标的 <input id="symbol" value="AAPL.US" autocomplete="off" /></label>
        <button id="load">查看行情</button>
      </section>

      <section class="grid">
        <article class="card quote-card">
          <div class="card-title"><span id="quote-symbol">—</span><span id="quote-source" class="muted">—</span></div>
          <strong id="last">—</strong>
          <div id="change" class="muted">—</div>
          <dl>
            <div><dt>开盘</dt><dd id="open">—</dd></div>
            <div><dt>最高</dt><dd id="high">—</dd></div>
            <div><dt>最低</dt><dd id="low">—</dd></div>
            <div><dt>成交量</dt><dd id="volume">—</dd></div>
          </dl>
        </article>

        <article class="card chart-card">
          <div class="card-title"><span>日线</span><span id="chart-state" class="muted">—</span></div>
          <canvas id="chart" width="900" height="300"></canvas>
        </article>

        <article class="card order-card">
          <div class="card-title"><span>下单</span><span class="muted">先预览</span></div>
          <form id="order-form">
            <div class="two"><label>方向 <select id="side"><option value="buy">买入</option><option value="sell">卖出</option></select></label><label>数量 <input id="quantity" type="number" min="0.0001" step="any" value="1" /></label></div>
            <label>订单类型 <select id="order-type"><option value="market">市价单</option><option value="limit">限价单</option></select></label>
            <label id="limit-wrap" class="hidden">限价 <input id="limit-price" type="number" min="0.0001" step="any" /></label>
            <button type="submit">预览订单</button>
          </form>
          <label id="confirmation-wrap" class="hidden">实盘确认码 <input id="confirmation" type="password" autocomplete="off" /></label>
          <button id="submit-order" class="secondary hidden" type="button">确认提交</button>
          <pre id="order-result" class="result">尚未提交</pre>
        </article>
      </section>
    </main>
    <script src="/static/app.js"></script>
  </body>
</html>
