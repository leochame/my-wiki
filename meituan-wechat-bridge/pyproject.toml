[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "meituan-wechat-bridge"
version = "0.1.0"
description = "Receive authorized Meituan orders and notify a personal WeChat group."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.135,<1",
  "httpx>=0.28,<1",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
mcp = ["mcp>=2.3,<3"]
dev = ["pytest>=8,<10", "ruff>=0.12,<1", "pyyaml>=6,<7"]
ui = ["playwright>=1.60,<2"]

[project.scripts]
order-bridge = "order_bridge.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/order_bridge"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
